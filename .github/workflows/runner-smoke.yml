name: Validate Order Handoff Rail
on:
  push:
    branches: [feat/order-living-handoff-rail]
    paths: [.github/workflows/runner-smoke.yml]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/order-living-handoff-rail
      - name: Build device target
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace 'Pure Pets.xcworkspace' \
            -scheme 'Pure Pets' \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/order-handoff-build.log
